name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  ORCA_REF: hil-phase4   # branch of englacial/orca that provides the site generator

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: results
      - uses: actions/checkout@v4
        with:
          repository: englacial/orca
          ref: ${{ env.ORCA_REF }}
          path: orca
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jinja2 matplotlib numpy ruamel.yaml
      - run: python -m tests.hil.orca_hil.report.build_site --results ../results --out ../_site
        working-directory: orca
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
